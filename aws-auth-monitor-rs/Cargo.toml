[package]
name = "aws-auth-monitor"
version = "0.1.0"
edition = "2021"
description = "AWS authentication status monitor for Starship prompt"

[dependencies]
aws-config = { version = "1", features = ["sso"] }
aws-sdk-sts = "1"
tokio = { version = "1", features = ["rt", "time", "fs", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = "7"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
